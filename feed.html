<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViewerBook - Newsfeed</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="flex justify-center min-h-screen bg-slate-950">

    <!-- Mobile Viewport Container -->
    <div class="w-full max-w-md bg-slate-900 min-h-screen border-x border-slate-800 relative pb-20 shadow-2xl">
        
        <!-- 1. Header Bar -->
        <header class="flex justify-between items-center px-4 py-3 border-b border-slate-800 sticky top-0 bg-slate-900/95 backdrop-blur z-30">
            <h1 class="text-2xl font-black text-sky-400 tracking-wider">ViewerBook</h1>
            <div class="flex items-center gap-3">
                <button class="bg-slate-800 p-2 rounded-full text-slate-300 text-sm">🔍</button>
                <button class="bg-slate-800 p-2 rounded-full text-slate-300 text-sm relative">
                    🔔
                    <span class="absolute top-0 right-0 w-2.5 h-2.5 bg-sky-500 rounded-full"></span>
                </button>
            </div>
        </header>

        <!-- 2. Create Post Input Box -->
        <div class="p-4 border-b border-slate-800 bg-slate-900">
            <div class="flex items-center gap-3 mb-3">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" class="w-10 h-10 rounded-full border border-sky-500 object-cover">
                <input type="text" id="postInput" placeholder="আপনার মনে এখন কি চলছে, ViewerBook এ শেয়ার করুন..." class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-full px-4 py-2.5 focus:outline-none focus:border-sky-500">
            </div>
            <div class="flex justify-between items-center pt-2 border-t border-slate-800/60 text-xs text-slate-400">
                <button class="flex items-center gap-1.5 hover:text-sky-400 transition">
                    <span class="text-rose-500">📷</span> ছবি/ভিডিও
                </button>
                <button class="flex items-center gap-1.5 hover:text-sky-400 transition">
                    <span class="text-emerald-500">🔴</span> লাইভ স্ট্রিমিং
                </button>
                <button onclick="addNewPost()" class="bg-sky-600 hover:bg-sky-500 text-white font-bold px-4 py-1.5 rounded-full text-xs transition">
                    পোস্ট
                </button>
            </div>
        </div>

        <!-- 3. Stories / Shorts Row -->
        <div class="p-4 border-b border-slate-800">
            <h3 class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-2.5">Viewer Stories</h3>
            <div class="flex gap-3 overflow-x-auto hide-scrollbar">
                <!-- Add Story Button -->
                <div class="min-w-[70px] flex flex-col items-center">
                    <div class="w-14 h-14 rounded-full border-2 border-dashed border-sky-500 flex items-center justify-center text-sky-400 font-bold text-xl cursor-pointer">
                        +
                    </div>
                    <span class="text-[10px] text-slate-400 mt-1">আপনার স্টোরি</span>
                </div>
                <!-- User Story 1 -->
                <div class="min-w-[70px] flex flex-col items-center">
                    <div class="w-14 h-14 rounded-full border-2 border-sky-400 p-0.5">
                        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&q=80" class="w-full h-full rounded-full object-cover">
                    </div>
                    <span class="text-[10px] text-slate-300 mt-1 truncate w-14 text-center">সানজিদা</span>
                </div>
                <!-- User Story 2 -->
                <div class="min-w-[70px] flex flex-col items-center">
                    <div class="w-14 h-14 rounded-full border-2 border-sky-400 p-0.5">
                        <img src="https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?auto=format&fit=crop&w=150&q=80" class="w-full h-full rounded-full object-cover">
                    </div>
                    <span class="text-[10px] text-slate-300 mt-1 truncate w-14 text-center">রাকিব</span>
                </div>
            </div>
        </div>

        <!-- 4. Dynamic Newsfeed Area -->
        <div id="feedContainer" class="divide-y divide-slate-800">

            <!-- Single Post Card -->
            <article class="p-4 bg-slate-900">
                <!-- User Info Header -->
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-2.5">
                        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" class="w-9 h-9 rounded-full object-cover border border-slate-700">
                        <div>
                            <div class="flex items-center gap-1.5">
                                <h4 class="text-sm font-bold text-white">তানজিল আহমেদ</h4>
                                <span class="bg-sky-600 text-white text-[9px] px-1.5 py-0.2 rounded font-bold">✓ Monetized</span>
                            </div>
                            <p class="text-[10px] text-slate-400">২ মিনিট আগে • 🌐</p>
                        </div>
                    </div>
                    <button class="text-slate-400 text-sm">•••</button>
                </div>

                <!-- Post Text -->
                <p class="text-xs text-slate-200 leading-relaxed mb-3">
                    ViewerBook সোশ্যাল মিডিয়া প্ল্যাটফর্মের ফিড আর্কিটেকচার টেস্ট করা হচ্ছে! এটি দ্রুত এবং স্মুথ কাজ করে। 🚀
                </p>

                <!-- Post Media Image -->
                <div class="rounded-xl overflow-hidden mb-3 border border-slate-800">
                    <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=600&q=80" class="w-full h-52 object-cover">
                </div>

                <!-- Engagement Stats -->
                <div class="flex justify-between items-center text-[11px] text-slate-400 pb-2 border-b border-slate-800/80">
                    <span>❤️ ১২৪ রিঅ্যাকশন</span>
                    <span>৪২ কমেন্ট • ১২ শেয়ার</span>
                </div>

                <!-- Action Buttons -->
                <div class="flex justify-between items-center pt-2 text-xs text-slate-300 font-medium">
                    <button onclick="toggleLike(this)" class="flex-1 py-1.5 flex items-center justify-center gap-1.5 hover:bg-slate-800 rounded-lg transition">
                        <span>🤍</span> লাইক
                    </button>
                    <button class="flex-1 py-1.5 flex items-center justify-center gap-1.5 hover:bg-slate-800 rounded-lg transition">
                        <span>💬</span> কমেন্ট
                    </button>
                    <button class="flex-1 py-1.5 flex items-center justify-center gap-1.5 hover:bg-slate-800 rounded-lg transition">
                        <span>↗️</span> শেয়ার
                    </button>
                </div>
            </article>

        </div>

        <!-- 5. Bottom Navigation Bar -->
        <nav class="fixed bottom-0 w-full max-w-md bg-slate-900 border-t border-slate-800 flex justify-around py-3 px-2 z-30">
            <button class="flex flex-col items-center text-sky-400">
                <span class="text-lg">🏠</span>
                <span class="text-[9px] font-bold">হোম</span>
            </button>
            <button class="flex flex-col items-center text-slate-400 hover:text-white">
                <span class="text-lg">🎬</span>
                <span class="text-[9px]">ভিডিও</span>
            </button>
            <button class="flex flex-col items-center text-slate-400 hover:text-white">
                <span class="text-lg">💎</span>
                <span class="text-[9px]">মনিটাইজেশন</span>
            </button>
            <button class="flex flex-col items-center text-slate-400 hover:text-white">
                <span class="text-lg">👤</span>
                <span class="text-[9px]">প্রোফাইল</span>
            </button>
        </nav>

    </div>

    <!-- Live Interaction Script -->
    <script>
        function toggleLike(btn) {
            if (btn.classList.contains('text-rose-500')) {
                btn.classList.remove('text-rose-500');
                btn.innerHTML = '<span>🤍</span> লাইক';
            } else {
                btn.classList.add('text-rose-500');
                btn.innerHTML = '<span>❤️</span> লাইকড';
            }
        }

        function addNewPost() {
            const input = document.getElementById('postInput');
            const text = input.value.trim();

            if (!text) {
                alert('পোস্ট করার জন্য কিছু লিখুন!');
                return;
            }

            const container = document.getElementById('feedContainer');
            const newPostHtml = `
                <article class="p-4 bg-slate-900">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center gap-2.5">
                            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" class="w-9 h-9 rounded-full object-cover border border-slate-700">
                            <div>
                                <div class="flex items-center gap-1.5">
                                    <h4 class="text-sm font-bold text-white">তানজিল আহমেদ</h4>
                                    <span class="bg-sky-600 text-white text-[9px] px-1.5 py-0.2 rounded font-bold">✓ Monetized</span>
                                </div>
                                <p class="text-[10px] text-slate-400">এখনই • 🌐</p>
                            </div>
                        </div>
                        <button class="text-slate-400 text-sm">•••</button>
                    </div>
                    <p class="text-xs text-slate-200 leading-relaxed mb-3">${text}</p>
                    <div class="flex justify-between items-center text-[11px] text-slate-400 pb-2 border-b border-slate-800/80">
                        <span>❤️ ০ রিঅ্যাকশন</span>
                        <span>০ কমেন্ট • ০ শেয়ার</span>
                    </div>
                    <div class="flex justify-between items-center pt-2 text-xs text-slate-300 font-medium">
                        <button onclick="toggleLike(this)" class="flex-1 py-1.5 flex items-center justify-center gap-1.5 hover:bg-slate-800 rounded-lg transition">
                            <span>🤍</span> লাইক
                        </button>
                        <button class="flex-1 py-1.5 flex items-center justify-center gap-1.5 hover:bg-slate-800 rounded-lg transition">
                            <span>💬</span> কমেন্ট
                        </button>
                        <button class="flex-1 py-1.5 flex items-center justify-center gap-1.5 hover:bg-slate-800 rounded-lg transition">
                            <span>↗️</span> শেয়ার
                        </button>
                    </div>
                </article>
            `;

            container.insertAdjacentHTML('afterbegin', newPostHtml);
            input.value = '';
        }
    </script>

</body>
</html>
