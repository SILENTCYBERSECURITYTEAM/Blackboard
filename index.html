<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViewerBook - OTP & Google Auth</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-slate-950 p-4">

    <!-- Auth Card Container -->
    <div class="w-full max-w-md bg-slate-900 rounded-2xl border border-slate-800 p-6 shadow-2xl space-y-4">
        
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-3xl font-black text-sky-400 tracking-wider">ViewerBook</h1>
            <p class="text-xs text-slate-400 mt-1">গুগল বা ফোন নম্বরে OTP দিয়ে সহজে লগইন করুন</p>
        </div>

        <!-- 1. Direct Google Sign-In Button -->
        <button onclick="handleGoogleAuth()" class="w-full flex items-center justify-center gap-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-2.5 px-4 rounded-xl border border-slate-700 transition text-xs">
            <svg class="w-4 h-4" viewBox="0 0 24 24">
                <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>
                <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12s.7 2.3 1.9 4.7l3.7-2.9z"/>
                <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
            </svg>
            Google / Gmail দিয়ে ১-ক্লিকে লগইন
        </button>

        <div class="flex items-center my-2">
            <div class="flex-1 border-t border-slate-800"></div>
            <span class="px-3 text-[10px] text-slate-500 uppercase font-bold">অথবা ফোন নম্বর / জিমেইল</span>
            <div class="flex-1 border-t border-slate-800"></div>
        </div>

        <!-- 2. Registration & Phone OTP Form -->
        <form onsubmit="handleFormSubmit(event)" class="space-y-3">
            
            <!-- First Name & Last Name Row -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">ফার্স্ট নেম</label>
                    <input type="text" required placeholder="তানজিল" class="w-full bg-slate-950 border border-slate-800 text-xs text-white px-3 py-2 rounded-xl focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">লাস্ট নেম</label>
                    <input type="text" required placeholder="আহমেদ" class="w-full bg-slate-950 border border-slate-800 text-xs text-white px-3 py-2 rounded-xl focus:outline-none focus:border-sky-500">
                </div>
            </div>

            <!-- Gmail Input -->
            <div>
                <label class="text-[10px] text-slate-400 block mb-1">জিমেইল অ্যাড্রেস</label>
                <input type="email" required placeholder="example@gmail.com" class="w-full bg-slate-950 border border-slate-800 text-xs text-white px-3 py-2 rounded-xl focus:outline-none focus:border-sky-500">
            </div>

            <!-- Phone Number Input with OTP Trigger -->
            <div>
                <label class="text-[10px] text-slate-400 block mb-1">ফোন নম্বর</label>
                <div class="flex gap-2">
                    <input type="tel" id="phoneInput" required placeholder="+880 1700-000000" class="flex-1 bg-slate-950 border border-slate-800 text-xs text-white px-3 py-2 rounded-xl focus:outline-none focus:border-sky-500">
                    <button type="button" onclick="sendOTP()" class="bg-slate-800 hover:bg-slate-700 text-sky-400 border border-slate-700 font-bold px-3 py-2 rounded-xl text-[11px] whitespace-nowrap transition">
                        OTP পাঠান
                    </button>
                </div>
            </div>

            <!-- OTP Input Box (Initially Hidden) -->
            <div id="otpBox" class="hidden bg-sky-950/30 p-3 rounded-xl border border-sky-500/30 space-y-1.5">
                <div class="flex justify-between items-center">
                    <label class="text-[10px] text-sky-300 font-bold">ভেরিফিকেশন OTP কোড দিন</label>
                    <span class="text-[9px] text-slate-400">কোড: <b class="text-amber-400">1234</b></span>
                </div>
                <input type="text" id="otpInput" maxlength="4" placeholder="৪ ডিজিটের কোড (যেমন: 1234)" class="w-full bg-slate-950 border border-sky-500/50 text-center font-mono text-sm tracking-widest text-sky-400 px-3 py-2 rounded-xl focus:outline-none">
            </div>

            <!-- Password & Confirm Password Row -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">পাসওয়ার্ড</label>
                    <input type="password" id="pass1" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 text-xs text-white px-3 py-2 rounded-xl focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">কনফার্ম পাসওয়ার্ড</label>
                    <input type="password" id="pass2" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 text-xs text-white px-3 py-2 rounded-xl focus:outline-none focus:border-sky-500">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 rounded-xl transition text-xs shadow-lg shadow-sky-600/20 mt-2">
                অ্যাকাউন্ট ভেরিফাই ও সাইন-আপ 🚀
            </button>
        </form>

    </div>

    <!-- Interactive Script -->
    <script>
        let isOtpSent = false;

        function handleGoogleAuth() {
            alert("গুগল/জিমেইল দিয়ে সফলভাবে অ্যাকাউন্ট কানেক্ট হয়েছে! নিউজফিডে রিডাইরেক্ট করা হচ্ছে...");
            window.location.href = "feed.html";
        }

        function sendOTP() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!phone) {
                alert("অনুগ্রহ করে প্রথমে ফোন নম্বর দিন!");
                return;
            }
            isOtpSent = true;
            document.getElementById('otpBox').classList.remove('hidden');
            alert(`আপনার ${phone} নম্বরে ৪ ডিজিটের OTP পাঠানো হয়েছে। টেস্ট কোড: 1234`);
        }

        function handleFormSubmit(event) {
            event.preventDefault();

            if (!isOtpSent) {
                alert("দয়া করে প্রথমে 'OTP পাঠান' বাটনে ক্লিক করে নম্বরটি ভেরিফাই করুন!");
                return;
            }

            const otp = document.getElementById('otpInput').value.trim();
            if (otp !== '1234') {
                alert("ভুল OTP কোড! সঠিক কোড (1234) দিন।");
                return;
            }

            const p1 = document.getElementById('pass1').value;
            const p2 = document.getElementById('pass2').value;

            if (p1 !== p2) {
                alert("দুটি পাসওয়ার্ড মিলছে না!");
                return;
            }

            alert("ফোন নম্বর ও OTP ভেরিফিকেশন সফল হয়েছে! নিউজফিডে রিডাইরেক্ট করা হচ্ছে...");
            window.location.href = "feed.html";
        }
    </script>

</body>
</html>
